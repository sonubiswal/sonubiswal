<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Sumit Kumar Biswal — AI and Automation Engineer in Training" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0d1b3d"/>
      <stop offset="1" stop-color="#1e1b6b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="l1t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="l2t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="l3t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <!-- isometric slab: top face + two side faces -->
    <g id="slabSides">
      <polygon points="-110,0 0,55 0,75 -110,20" fill="#000" fill-opacity="0.38"/>
      <polygon points="110,0 0,55 0,75 110,20" fill="#000" fill-opacity="0.18"/>
    </g>
    <polygon id="slabTop" points="0,-55 110,0 0,55 -110,0"/>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)"/>

  <!-- drifting particles -->
  <g fill="#ffffff">
    <circle cx="120" cy="60" r="1.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="340" r="1.3"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="48" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="360" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="70" r="1.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="330" r="1.2"><animate attributeName="opacity" values="0.9;0.15;0.9" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 3D layered stack (right) -->
  <g transform="translate(905 205)">
    <circle r="190" fill="url(#aura)"/>

    <!-- vertical connector -->
    <line x1="0" y1="-120" x2="0" y2="110" stroke="#a5b4fc" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="4s" repeatCount="indefinite"/>
    </line>

    <!-- layer 3 (bottom) -->
    <g transform="translate(0 70)">
      <animateTransform attributeName="transform" type="translate" values="0 70; 0 78; 0 70" dur="6s" repeatCount="indefinite"/>
      <use href="#slabSides"/>
      <use href="#slabTop" fill="url(#l3t)" fill-opacity="0.92"/>
      <polygon points="0,-55 110,0 0,55 -110,0" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
      <text y="6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" letter-spacing="2">REINFORCEMENT</text>
    </g>

    <!-- layer 2 (middle) -->
    <g transform="translate(0 -5)">
      <animateTransform attributeName="transform" type="translate" values="0 -5; 0 -15; 0 -5" dur="5s" repeatCount="indefinite"/>
      <use href="#slabSides"/>
      <use href="#slabTop" fill="url(#l2t)" fill-opacity="0.92"/>
      <polygon points="0,-55 110,0 0,55 -110,0" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
      <text y="6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" letter-spacing="2">GEOSPATIAL</text>
    </g>

    <!-- layer 1 (top) -->
    <g transform="translate(0 -80)">
      <animateTransform attributeName="transform" type="translate" values="0 -80; 0 -94; 0 -80" dur="4.2s" repeatCount="indefinite"/>
      <use href="#slabSides"/>
      <use href="#slabTop" fill="url(#l1t)" fill-opacity="0.95"/>
      <polygon points="0,-55 110,0 0,55 -110,0" fill="none" stroke="#ffffff" stroke-opacity="0.45"/>
      <text y="6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" letter-spacing="2">FORECASTING</text>
    </g>
  </g>

  <!-- text block -->
  <text x="70" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#93c5fd" letter-spacing="6">HELLO, I'M</text>
  <text x="68" y="206" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" fill="url(#name)">Sumit Kumar Biswal</text>
  <text x="70" y="256" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#dbeafe">AI &amp; Automation Engineer in Training</text>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#fff">
    <rect x="70" y="296" width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.13"/>
    <text x="145" y="319" text-anchor="middle">Applied ML</text>
    <rect x="232" y="296" width="158" height="36" rx="18" fill="#ffffff" fill-opacity="0.13"/>
    <text x="311" y="319" text-anchor="middle">Deep Learning</text>
    <rect x="402" y="296" width="130" height="36" rx="18" fill="#ffffff" fill-opacity="0.13"/>
    <text x="467" y="319" text-anchor="middle">Geospatial</text>
    <rect x="544" y="296" width="130" height="36" rx="18" fill="#ffffff" fill-opacity="0.13"/>
    <text x="609" y="319" text-anchor="middle">Python First</text>
  </g>
</svg>
