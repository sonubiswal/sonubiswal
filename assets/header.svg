      <path fill="none" stroke="#0b2a5a" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round" transform="translate(24 10)" d="M-7 1 Q-3.5 -4 0 1 Q3.5 -4 7 1">
        <animate attributeName="d" values="M-7 1 Q-3.5 -4 0 1 Q3.5 -4 7 1;M-7 -3 Q-3.5 0 0 1 Q3.5 0 7 -3;M-7 1 Q-3.5 -4 0 1 Q3.5 -4 7 1" dur="0.8s" begin="0.2s" repeatCount="indefinite"/>
      </path>
      <path fill="none" stroke="#0b2a5a" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round" transform="translate(-20 14)" d="M-7 1 Q-3.5 -4 0 1 Q3.5 -4 7 1">
        <animate attributeName="d" values="M-7 1 Q-3.5 -4 0 1 Q3.5 -4 7 1;M-7 -3 Q-3.5 0 0 1 Q3.5 0 7 -3;M-7 1 Q-3.5 -4 0 1 Q3.5 -4 7 1" dur="0.8s" begin="0.4s" repeatCount="indefinite"/>
      </path>
      <path fill="none" stroke="#0b2a5a" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round" transform="translate(46 -6)" d="M-7 1 Q-3.5 -4 0 1 Q3.5 -4 7 1">
        <animate attributeName="d" values="M-7 1 Q-3.5 -4 0 1 Q3.5 -4 7 1;M-7 -3 Q-3.5 0 0 1 Q3.5 0 7 -3;M-7 1 Q-3.5 -4 0 1 Q3.5 -4 7 1" dur="0.8s" begin="0.1s" repeatCount="indefinite"/>
