<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Hi, I'm Sumit Kumar Biswal</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1565c0"/>
      <stop offset="0.35" stop-color="#3a8fe0"/>
      <stop offset="0.52" stop-color="#7cc4f5"/>
      <stop offset="0.63" stop-color="#c0e8ff"/>
      <stop offset="0.67" stop-color="#eaf8ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff3c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
