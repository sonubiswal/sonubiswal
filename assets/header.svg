        <animate attributeName="width" values="120;72;120" dur="2.9s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="x" values="540;564;540" dur="2.9s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
