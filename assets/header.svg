<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Hi, I'm Sumit Kumar Biswal</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16346e"/>
      <stop offset="0.35" stop-color="#3d6fb8"/>
      <stop offset="0.52" stop-color="#9bb8e8"/>
      <stop offset="0.63" stop-color="#ffb3a0"/>
      <stop offset="0.67" stop-color="#ffe0a0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe0a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe0a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
