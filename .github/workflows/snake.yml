# ══════════════════════════════════════════════════════════════════════════════
#  CONTRIBUTION SNAKE  ·  optional add-on for the profile README
#  ──────────────────────────────────────────────────────────────────────────────
#  INSTALL
#    1. In the  sonubiswal/sonubiswal  repo create the folder:
#         .github/workflows/
#    2. Save this file there as:  snake.yml
#    3. Commit, then open the repo's "Actions" tab and run "Generate Snake" once
#       (it also re-runs automatically every 12 hours).
#    4. It publishes the SVGs to an "output" branch. The README block already
#       points at that branch, so nothing else needs editing.
# ══════════════════════════════════════════════════════════════════════════════

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"      # every 12 hours
  workflow_dispatch:             # manual run from the Actions tab
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
