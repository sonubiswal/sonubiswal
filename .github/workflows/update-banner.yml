name: Update time-of-day banner

on:
  schedule:
    # Every 15 minutes, offset to :07/:22/:37/:52 to stay clear of the
    # congested :00/:15/:30/:45 slots where GitHub most often delays or drops
    # scheduled runs. Idempotent, so a skipped run is fixed by the next one.
    - cron: "7-59/15 * * * *"
  push:
    branches: [main]       # re-evaluate right after any push you make
  workflow_dispatch:       # run it by hand from the Actions tab

permissions:
  contents: write          # commit the banner
  actions: write           # keep-alive: stops GitHub disabling the schedule after 60 idle days
  issues: write            # open / close a "banner is failing" issue

# Never run two at once; queue instead of cancelling a run that is mid-push.
concurrency:
  group: banner-time-of-day
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  banner:
    name: Pick IST banner and commit it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test the schedule logic
        run: bash .github/scripts/test-banner-logic.sh

      - name: Apply the banner, commit, and push (with retries)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME}"

          for attempt in 1 2 3 4; do
            # Always start from the latest remote state; the apply step is
            # idempotent, so redoing it after a lost race is safe.
            git fetch --quiet origin "$branch"
            git reset --hard "origin/${branch}"

            bash .github/scripts/apply-banner.sh
            # shellcheck disable=SC1090
            source "${RUNNER_TEMP}/banner.env"

            git add assets/header.svg README.md
            if git diff --cached --quiet; then
              echo "Banner already up to date. Nothing to commit."
              break
            fi

            git commit -m "chore: banner -> ${THEME} (IST ${IST})"
            if git push origin "HEAD:${branch}"; then
              echo "Pushed on attempt ${attempt}."
              break
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "::error title=Push failed::could not push after ${attempt} attempts"
              exit 1
            fi
            echo "Push attempt ${attempt} lost a race; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done

          {
            echo "### Banner"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| India time | \`${IST}\` |"
            echo "| Scene | \`${THEME}\` |"
            echo "| Changed this run | ${CHANGED} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the schedule alive
        continue-on-error: true
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update-banner.yml/enable"

      - name: Close the failure issue after a good run
        if: success()
        continue-on-error: true
        run: |
          for n in $(gh issue list --state open --label banner-workflow --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recovered: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done

      - name: Open an issue if the job failed
        if: failure()
        continue-on-error: true
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create banner-workflow --color d93f0b --description "Time-of-day banner workflow" 2>/dev/null || true
          existing="$(gh issue list --state open --label banner-workflow --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: ${run_url}"
          else
            gh issue create --label banner-workflow \
              --title "Banner workflow is failing" \
              --body "The time-of-day banner job failed. Run: ${run_url}"
          fi
